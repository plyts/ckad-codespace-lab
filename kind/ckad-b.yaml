# Second cluster, un seul nœud : sert à s'entraîner à changer de contexte comme à l'examen.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: ckad-b
networking:
  ipFamily: ipv4
nodes:
- role: control-plane
  labels:
    ingress-ready: "true"
  extraPortMappings:
  - containerPort: 80
    hostPort: 8081
    protocol: TCP
