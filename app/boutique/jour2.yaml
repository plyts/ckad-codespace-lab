# Boutique, fin de la journée 2 : configuration, secret, ressources, 3 réplicas d'api.
apiVersion: apps/v1
kind: Deployment
metadata: {name: redis, labels: {app: redis, tier: data}}
spec:
  replicas: 1
  selector: {matchLabels: {app: redis}}
  template:
    metadata: {labels: {app: redis, tier: data}}
    spec:
      containers:
      - name: redis
        image: redis:7.4-alpine
        ports: [{containerPort: 6379}]
---
apiVersion: v1
kind: Service
metadata: {name: redis}
spec:
  selector: {app: redis}
  ports: [{port: 6379, targetPort: 6379}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: api, labels: {app: api, tier: backend}}
spec:
  replicas: 3
  selector: {matchLabels: {app: api}}
  template:
    metadata: {labels: {app: api, tier: backend}}
    spec:
      containers:
      - name: api
        image: hashicorp/http-echo:1.0.0
        args: ["-text=api v1"]
        ports: [{containerPort: 5678}]
        env:
        - name: REDIS_PASSWORD
          valueFrom: {secretKeyRef: {name: redis-auth, key: password}}
        resources:
          requests: {cpu: 50m, memory: 32Mi}
          limits: {cpu: 100m, memory: 64Mi}
---
apiVersion: v1
kind: Service
metadata: {name: api}
spec:
  selector: {app: api}
  ports: [{port: 80, targetPort: 5678}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: front, labels: {app: front, tier: web}}
spec:
  replicas: 2
  selector: {matchLabels: {app: front}}
  template:
    metadata: {labels: {app: front, tier: web}}
    spec:
      containers:
      - name: front
        image: nginx:1.27-alpine
        ports: [{containerPort: 80}]
        volumeMounts:
        - {name: html, mountPath: /usr/share/nginx/html}
      volumes:
      - name: html
        configMap: {name: front-html}
---
apiVersion: v1
kind: Service
metadata: {name: front}
spec:
  selector: {app: front}
  ports: [{port: 80, targetPort: 80}]
---
apiVersion: v1
kind: ConfigMap
metadata: {name: front-html}
data:
  index.html: "Boutique jour 2"
---
apiVersion: v1
kind: Secret
metadata: {name: redis-auth}
stringData:
  password: r3d1s-pass
